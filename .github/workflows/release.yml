# Publishes to PyPI when you publish a GitHub Release.
# One-time setup: on pypi.org add a "trusted publisher" for this repository
# (workflow: release.yml, environment: pypi). No API tokens needed.
name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
